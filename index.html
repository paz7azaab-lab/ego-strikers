<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071525"><title>EGO STRIKERS — Arcade Football Prototype</title>
<style>
:root{color-scheme:dark;--cyan:#57f3ff;--orange:#ff8a3d;--panel:#0b1c2ddd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#173e54,#07111f 65%);font-family:system-ui,sans-serif;color:#f2fbff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}.shell{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}.logo{font-weight:1000;letter-spacing:.12em;font-style:italic;font-size:clamp(18px,4vw,28px)}.logo span{color:var(--cyan)}.hud{display:flex;gap:8px;align-items:center}.pill,button{border:1px solid #4a7b91;background:#0c2234;color:#f2fbff;border-radius:12px;padding:9px 12px;font-weight:800}.arena{position:relative;border:1px solid #3d8495;border-radius:18px;overflow:hidden;box-shadow:0 20px 80px #0008;background:#125f49}canvas{display:block;width:100%;height:min(66vh,600px);min-height:330px;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;font-weight:1000;font-style:italic;font-size:clamp(24px,7vw,60px);text-shadow:0 5px 30px #000}.overlay span{color:var(--cyan)}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.small{font-size:12px;color:#a8c5d3;line-height:1.5}.active{border-color:var(--cyan);box-shadow:0 0 16px #57f3ff55}.shoot{background:linear-gradient(135deg,#ff7938,#b32b41);border-color:#ffbd8a}.touchpad{display:none;justify-content:space-between;gap:12px;margin-top:10px}.padgrid{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:4px}.padgrid button{padding:0;touch-action:none}.actions{display:flex;gap:6px;align-items:center}.actions button{min-width:62px;min-height:56px;touch-action:none}.footer{margin-top:8px;color:#83a5b8;font-size:11px}@media(pointer:coarse){.touchpad{display:flex}}@media(max-width:520px){body{padding:8px}.pill,button{padding:8px 9px}.hud{gap:4px}canvas{min-height:360px;height:58vh}.small{max-width:100%}}
</style>
</head><body><main class="shell">
<header><div class="logo">EGO <span>STRIKERS</span></div><div class="hud"><div class="pill">GOALS <b id="score">0</b></div><div class="pill">EGO <b id="energy">0%</b></div><button id="pause">Ⅱ</button></div></header>
<div class="arena"><canvas id="game" aria-label="Playable arcade football prototype"></canvas><div class="overlay" id="banner"><div>FIND YOUR <span>EGO</span><div style="font-size:14px;font-style:normal;letter-spacing:.15em">MOVE • CHARGE • STRIKE</div><button id="start" style="pointer-events:auto;margin-top:16px">KICK OFF</button></div></div></div>
<div class="bottom"><div class="controls"><button data-mode="electric" class="active">⚡ ELECTRIC</button><button data-mode="fire">🔥 FIRE</button><button data-mode="energy">✦ ENERGY</button><button id="motion">VFX: ON</button></div><button class="shoot" id="shoot">SHOOT  ↗</button></div>
<div class="touchpad"><div class="padgrid"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="actions"><button id="dash">EGO<br>DASH</button><button class="shoot" id="touchshoot">SHOOT<br>⚽</button></div></div>
<div class="small">Move: WASD / arrows · Shoot: Space · EGO Dash: Shift · Choose a signature shot. Touch controls appear on phones.</div><div class="footer">Original prototype • Offline single-player • Not yet a 3D or online game • Mobile hardware testing still required</div>
</main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),banner=document.getElementById('banner'),scoreEl=document.getElementById('score'),energyEl=document.getElementById('energy');
let W=800,H=520,scale=1,running=false,paused=false,motion=true,score=0,energy=0,mode='electric',last=0,goalFlash=0,shake=0,particles=[],keys={},touchDirs={},shotCooldown=0;
const p={x:400,y:390,vx:0,vy:0,r:14},b={x:400,y:350,vx:0,vy:0,r:8,trail:[]},keeper={x:400,y:100,vx:0};
function resize(){const rect=c.getBoundingClientRect();scale=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;c.width=Math.round(W*scale);c.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0)}
window.addEventListener('resize',resize);resize();
function field(){ctx.fillStyle='#117653';ctx.fillRect(0,0,W,H);let stripe=H/10;for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#147b56':'#18845d';ctx.fillRect(0,i*stripe,W,stripe)}ctx.strokeStyle='#b8f6d8aa';ctx.lineWidth=2;ctx.strokeRect(12,12,W-24,H-24);ctx.beginPath();ctx.moveTo(12,H*.5);ctx.lineTo(W-12,H*.5);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.12,0,Math.PI*2);ctx.stroke();ctx.strokeRect(W*.29,12,W*.42,H*.17);ctx.strokeRect(W*.39,12,W*.22,H*.07);ctx.strokeRect(W*.29,H-12-H*.17,W*.42,H*.17);ctx.strokeRect(W*.39,H-12-H*.07,W*.22,H*.07);ctx.fillStyle='#d9ffff';ctx.fillRect(W*.39,5,W*.22,9);ctx.fillRect(W*.39,H-14,W*.22,9)}
function glow(x,y,r,color){ctx.save();ctx.shadowBlur=r*2;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function player(){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#08172466';ctx.beginPath();ctx.ellipse(2,12,17,7,0,0,Math.PI*2);ctx.fill();glow(0,0,15,'#16c9e9');ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.arc(0,-3,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9b48';ctx.fillRect(-10,4,20,10);ctx.fillStyle='#102a43';ctx.fillRect(-9,12,7,9);ctx.fillRect(3,12,7,9);ctx.restore()}
function ball(){for(let i=0;i<b.trail.length;i++){let t=b.trail[i];ctx.globalAlpha=(i+1)/b.trail.length*.35;glow(t.x,t.y,3+i*.7,mode==='fire'?'#ff692e':mode==='energy'?'#bb8cff':'#55f8ff')}ctx.globalAlpha=1;ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle='#fff';ctx.shadowBlur=10;ctx.shadowColor='#fff';ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#142538';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(3,-4);ctx.lineTo(5,3);ctx.lineTo(-2,5);ctx.closePath();ctx.stroke();ctx.restore()}
function spawn(x,y,color,n=12){if(!motion)return;for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*180;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.5,max:.85,color,r:2+Math.random()*4})}}
function shoot(){if(!running||paused||shotCooldown>0)return;let dx=W/2-b.x,dy=30-b.y,d=Math.hypot(dx,dy)||1;b.vx=dx/d*(mode==='energy'?600:mode==='fire'?530:570);b.vy=dy/d*(mode==='energy'?600:mode==='fire'?530:570);shotCooldown=.45;energy=Math.max(0,energy-35);spawn(b.x,b.y,mode==='fire'?'#ff602c':mode==='energy'?'#c79cff':'#56f6ff',22);p.vx-=dx/d*40;p.vy-=dy/d*40}
function resetBall(){b.x=p.x;b.y=p.y-26;b.vx=0;b.vy=0;b.trail=[]}
function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;if(!paused&&running){shotCooldown=Math.max(0,shotCooldown-dt);energy=Math.min(100,energy+dt*3);let ax=(keys.ArrowRight||keys.d||touchDirs.right?1:0)-(keys.ArrowLeft||keys.a||touchDirs.left?1:0),ay=(keys.ArrowDown||keys.s||touchDirs.down?1:0)-(keys.ArrowUp||keys.w||touchDirs.up?1:0),len=Math.hypot(ax,ay)||1;p.vx+=(ax/len*260-p.vx)*Math.min(1,dt*8);p.vy+=(ay/len*260-p.vy)*Math.min(1,dt*8);p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(28,Math.min(W-28,p.x));p.y=Math.max(H*.53,Math.min(H-30,p.y));let dist=Math.hypot(p.x-b.x,p.y-b.y);if(dist<30&&Math.hypot(b.vx,b.vy)<120){b.x+=(p.x-b.x)*dt*5;b.y+=(p.y-24-b.y)*dt*5}b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.985,dt*60);b.vy*=Math.pow(.985,dt*60);b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();keeper.x+=(b.x-keeper.x)*dt*1.8;keeper.x=Math.max(W*.34,Math.min(W*.66,keeper.x));if(b.y<26&&b.x>W*.39&&b.x<W*.61){score++;scoreEl.textContent=score;goalFlash=.8;shake=8;spawn(b.x,25,'#fff',36);resetBall()}else if(b.y<20||b.x<15||b.x>W-15||b.y>H-15){b.vx*=-.65;b.vy*=-.65;b.x=Math.max(18,Math.min(W-18,b.x));b.y=Math.max(22,Math.min(H-20,b.y))}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.vx*=.97;q.vy*=.97}particles=particles.filter(q=>q.life>0);goalFlash=Math.max(0,goalFlash-dt);shake=Math.max(0,shake-dt*30)}
ctx.save();if(motion&&shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);field();ctx.fillStyle='#071a2b';ctx.fillRect(W*.39,10,W*.22,9);ctx.fillStyle='#e5ffff';ctx.fillRect(W*.39,10,W*.22,5);glow(keeper.x,48,12,'#ff9a4b');ctx.fillStyle='#ffe3bf';ctx.fillRect(keeper.x-9,39,18,17);ctx.fillStyle='#ff7a38';ctx.fillRect(keeper.x-11,49,22,10);for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/q.max);glow(q.x,q.y,q.r,q.color)}ctx.globalAlpha=1;ball();player();if(goalFlash>0&&motion){ctx.fillStyle='rgba(255,255,255,'+goalFlash*.24+')';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='italic 1000 '+Math.min(64,W*.12)+'px system-ui';ctx.textAlign='center';ctx.fillText('GOAL!',W/2,H*.43)}ctx.restore();energyEl.textContent=Math.round(energy)+'%';requestAnimationFrame(frame)}
function start(){running=true;banner.style.display='none';resetBall()}document.getElementById('start').addEventListener('click',start);document.getElementById('shoot').addEventListener('click',shoot);document.getElementById('touchshoot').addEventListener('click',shoot);document.getElementById('pause').addEventListener('click',()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'});document.getElementById('motion').addEventListener('click',e=>{motion=!motion;e.target.textContent='VFX: '+(motion?'ON':'REDUCED')});document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{mode=el.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===el))}));document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.code==='Space')shoot();if(e.key==='Shift'&&energy>=20){energy-=20;p.vx*=1.8;p.vy*=1.8;spawn(p.x,p.y,'#58f4ff',16)}});document.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-dir]').forEach(el=>{const d=el.dataset.dir;el.addEventListener('pointerdown',e=>{e.preventDefault();touchDirs[d]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>touchDirs[d]=false))});document.getElementById('dash').addEventListener('click',()=>{if(energy>=20){energy-=20;p.vy-=100;spawn(p.x,p.y,'#58f4ff',16)}});resetBall();requestAnimationFrame(frame);
})();
</script></body></html>

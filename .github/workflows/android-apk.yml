name: EGO STRIKERS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Run prototype static checks
        run: npm test

      - name: Prepare web app
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release APK candidate
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: ego-strikers-android-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            android/build/reports/
            android/app/build/reports/
